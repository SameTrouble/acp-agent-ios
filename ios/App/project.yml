name: ACPAgent
options:
  bundleIdPrefix: com.acp-agent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    DEVELOPMENT_TEAM: "$(ACP_DEVELOPMENT_TEAM)"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ACPAgentCore:
    path: ../ACPAgentKit
targets:
  ACPAgent:
    type: application
    platform: iOS
    sources:
      - path: ACPAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acp-agent.ios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # Automatic signing in both configurations: Xcode resolves the
        # development identity for device runs and the App Store distribution
        # profile when archiving, so no profile files live in the repo.
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # Distribution builds are versioned by the release script; the value
        # here is only the fallback for local archives.
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
    dependencies:
      - package: ACPAgentCore
        product: ACPAgentCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ACP Agent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ACP Agent connects only to the user's own companion server, which
        # can be at any address — LAN IP, EasyTier virtual IP, tailnet IP, a
        # self-hosted domain, etc. ATS exception domains don't apply to IP
        # addresses, and the set of valid domains is unbounded, so we allow
        # arbitrary loads. Users control which server they connect to and
        # only their own token is ever sent over the wire.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
